# Runs in the PUBLIC repository github.com/WhatsArabHQ/whatsarab-sdk, which is
# a snapshot of this sdks/ folder (see .github/workflows/mirror-sdks.yml in the
# main repository). Inside the main repository this file is inert: GitHub only
# reads workflows from the repository root.
#
# Tests only. Publishing to npm and PyPI is a manual release step and never
# runs from here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The tests import ../dist, so build first.
      - run: npm run build
      - run: npm test

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
