[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsarab"
version = "0.7.0"
description = "Official Python client for the WhatsArab API — WhatsApp messages from any of your numbers, media, templates, OTP, events, and signed webhooks on the official Meta Cloud API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "WhatsArab" }]
keywords = ["whatsapp", "whatsapp-business-api", "meta-cloud-api", "messaging", "otp", "mena", "arabic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://whatsarab.com/docs"
Documentation = "https://whatsarab.com/docs"
Support = "https://whatsarab.com/support"
Source = "https://github.com/WhatsArabHQ/whatsarab-sdk"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/whatsarab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
